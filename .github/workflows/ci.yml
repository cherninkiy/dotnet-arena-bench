name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

  # Manual run from the Actions tab: choose the BenchmarkDotNet job, an optional
  # filter and (for long profiles) a single runner instead of the matrix.
  # Artifacts are uploaded for every run, manual or not.
  workflow_dispatch:
    inputs:
      job:
        description: 'BenchmarkDotNet job'
        required: true
        default: short
        type: choice
        options:
          - short
          - default
          - dry
      filter:
        description: 'BDN --filter glob, e.g. *T2* or *T1StreamBench* (empty or * = all)'
        required: false
        default: '*'
        type: string
      os:
        description: 'Runner(s): all, or one label - a long profile is cheaper on a single runner'
        required: false
        default: all
        type: choice
        options:
          - all
          - ubuntu-latest
          - windows-latest
          - macos-latest

jobs:
  build:
    name: build-test-bench (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release

      # The short bench is a regression smoke run, not a metrics collection
      # (ADR-002: no C toolchain involved). A manual run can ask for the full
      # profile or for a single series; push and pull_request always keep the
      # whole matrix and the defaults.
      - name: Bench - PoC-1 (Serialization)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.os == 'all' || inputs.os == matrix.os }}
        run: >-
          dotnet run -c Release --project benchmarks/ArenaBench.Serialization.Bench --
          --job "${{ inputs.job || 'short' }}"
          --filter "${{ inputs.filter || '*' }}"

      - name: Bench - PoC-2 (Allocator)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.os == 'all' || inputs.os == matrix.os }}
        run: >-
          dotnet run -c Release --project benchmarks/ArenaBench.Allocator.Bench --
          --job "${{ inputs.job || 'short' }}"
          --filter "${{ inputs.filter || '*' }}"

      # One report per benchmark class (md/csv/html) plus the BDN logs, so a run
      # can be inspected or cited in docs/*.md without re-running it. Uploaded
      # even when a bench step failed, which is exactly when it matters.
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ matrix.os }}
          path: |
            BenchmarkDotNet.Artifacts/results
            BenchmarkDotNet.Artifacts/log
          if-no-files-found: warn
          retention-days: 14
