name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    name: build-test-short-bench (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release

      # Short bench is a regression smoke run, not a metrics collection
      # (ADR-002: does not require any C toolchain).
      - name: Short bench - PoC-1 (Serialization)
        run: dotnet run -c Release --project benchmarks/ArenaBench.Serialization.Bench -- --job short

      - name: Short bench - PoC-2 (Allocator)
        run: dotnet run -c Release --project benchmarks/ArenaBench.Allocator.Bench -- --job short
